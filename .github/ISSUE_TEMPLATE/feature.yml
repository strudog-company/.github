name: Feature
description: New behavior or improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        One outcome per issue. Evidence is tests or a screenshot of the gap — not file lists or line numbers.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One-line statement of the requested capability.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or impossible today, and why that matters.
    validations:
      required: true
  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed solution
      description: Desired behavior. Be specific.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other approaches and why they are weaker.
  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: Who this helps, how often, what it unblocks.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Tests, a screenshot, or prior art. Not file lists or line numbers.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: My attached files and text contain no confidential or client-identifying data.
          required: true
