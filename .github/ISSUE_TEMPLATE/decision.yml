name: Decision
description: A call we need to make. Options plus one recommendation.
title: "[Decision]: "
body:
  - type: markdown
    attributes:
      value: |
        High-bandwidth. Pick a direction. One recommendation, one-line reason.
  - type: textarea
    id: call
    attributes:
      label: The call
      description: The decision in one sentence.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Why this is in front of us
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: Options
      description: Two to four. One line each. Put the recommendation first.
      placeholder: |
        1. (recommended) …
        2. …
    validations:
      required: true
  - type: textarea
    id: recommend
    attributes:
      label: Recommendation
      description: Pick one. One-line reason.
    validations:
      required: true
  - type: textarea
    id: cost
    attributes:
      label: Cost of being wrong
      description: Optional. What we eat if this call is bad.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: My attached files and text contain no confidential or client-identifying data.
          required: true
